name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - uses: fcitx/github-actions@clang-format
  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules fmt libuv boost git icu dbus libxkbcommon xkeyboard-config gjs
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v4
        with:
          path: 'fcitx5/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=On -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=On -DENABLE_SERVER=Off -DENABLE_EMOJI=Off -DUSE_SYSTEMD=Off
      - uses: actions/checkout@v4
        with:
          path: fcitx5-bamboo
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          source-root: fcitx5-bamboo
      - name: Build and Install fcitx5-bamboo
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-bamboo
          cmake-option: -DENABLE_GNOME_INTEGRATION=ON
      - name: Test
        run: |
          ctest --test-dir fcitx5-bamboo/build --output-on-failure
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Sanitize addon and indicator lifecycle
        if: matrix.compiler == 'gcc'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S fcitx5-bamboo -B fcitx5-bamboo/build-integration-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_GNOME_INTEGRATION=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build fcitx5-bamboo/build-integration-sanitize --parallel 2
          ctest --test-dir fcitx5-bamboo/build-integration-sanitize --output-on-failure

  sanitize:
    name: Native core sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libicu-dev
      - name: Configure
        run: >-
          cmake -S bamboo/native -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --build build-sanitize
          ctest --test-dir build-sanitize --output-on-failure
